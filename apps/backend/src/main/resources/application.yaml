spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    open-in-view: false

  datasource:
    driver-class-name: org.postgresql.Driver
  ai:
    vectorstore:
      pgvector:
        dimensions: 1536
        index-type: HNSW
        distance-type: cosine_distance
        schema-name: public
        table-name: ai_docs
        initialize-schema: true
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL}
          temperature: 0.65
        embedding:
          text:
            model: ${GEMINI_EMBEDDING_MODEL}
            dimensions: 1536
          api-key: ${GEMINI_API_KEY}
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB
      enabled: true

jwt:
  access-secret: ${JWT_ACCESS}
  refresh-secret: ${JWT_REFRESH}
  access-expiration: ${JWT_EXP_ACCESS}
  refresh-expiration: ${JWT_EXP_REFRESH}

app:
  frontend-url: ${FRONTEND_URL}