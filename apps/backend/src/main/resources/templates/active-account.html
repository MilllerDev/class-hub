<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verificación de correo</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#f4f4f5; padding: 40px 16px;">
    <tr>
        <td align="center">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width: 480px; background-color:#ffffff; border-radius: 12px;">
                <tr>
                    <td align="center" style="padding: 48px 40px;">

                        <h1 style="margin:0 0 12px 0; font-size: 20px; color: #18181b; font-weight: 600;">
                            Hola <span th:text="${name}">Usuario</span>
                        </h1>

                        <p style="margin:0 0 28px 0; font-size: 15px; line-height: 1.6; color: #52525b;">
                            Confirma tu correo para activar tu cuenta.
                        </p>

                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="border-radius: 8px; background-color: #18181b;">
                                    <a th:href="${verificationUrl}"
                                       style="display:inline-block; padding: 13px 28px; font-size: 15px; font-weight: 500; color: #ffffff; text-decoration: none; border-radius: 8px;">
                                        Verificar correo
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 28px 0 0 0; font-size: 13px; line-height: 1.6; color: #a1a1aa;">
                            Si el botón no funciona, copia y pega este enlace:
                        </p>
                        <p style="margin: 6px 0 0 0; font-size: 13px; line-height: 1.6; word-break: break-all;">
                            <a th:href="${verificationUrl}" th:text="${verificationUrl}"
                               style="color: #3f3f46; text-decoration: underline;">
                                https://example.com/verify
                            </a>
                        </p>

                        <p style="margin: 24px 0 0 0; font-size: 12px; color: #a1a1aa;">
                            Si no creaste esta cuenta, ignora este correo.
                        </p>

                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
