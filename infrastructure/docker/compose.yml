services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: class-hub-backend
    image: class-hub-backend
    ports:
      - "8080:8080"
    env_file:
      - ../../apps/backend/.env
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg15
    container_name: class-hub-db
    env_file:
      - ../../apps/backend/.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    name: class-hub-data
